name: update-chakra-map

# Turns your REAL GitHub contribution calendar into assets/chakra-map.svg.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/chakra-map.mjs'
      - 'scripts/lib.mjs'

permissions:
  contents: write

jobs:
  chakra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate chakra-map.svg
        env:
          # Optional: add a PAT as the repo secret GH_PAT (scopes: read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/chakra-map.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chakra-map.svg
          git diff --cached --quiet || git commit -m "chore: sync chakra log [skip ci]" && git push
