name: frame-gif

# Re-builds assets/gif/framed.gif whenever you replace assets/gif/current.gif.
on:
  push:
    paths:
      - 'assets/gif/current.gif'
      - 'tools/frame_gif.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python tools/frame_gif.py
      - name: Commit framed.gif if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gif/framed.gif
          git diff --cached --quiet || git commit -m "chore: re-frame gif [skip ci]" && git push
