name: frame-gif
on:
  push:
    paths: ['assets/gif/current.gif', 'tools/frame_gif.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Frame the GIF (writes framed.svg + framed.gif)
        run: python3 tools/frame_gif.py
      - name: Commit if changed
        run: |
          git config user.name "frame-bot"
          git config user.email "frame-bot@users.noreply.github.com"
          git add assets/gif/framed.svg assets/gif/framed.gif
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "frame gif: rebuild player [skip ci]"
          git push
