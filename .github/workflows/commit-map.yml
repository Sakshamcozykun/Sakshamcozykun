name: update-commit-map
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate commit map
        run: node scripts/commit-map.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "commit-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/commit-map.svg
          git diff --cached --quiet || (git commit -m "chore: sync commit map" && git push)
